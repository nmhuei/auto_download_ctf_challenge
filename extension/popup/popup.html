<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CTF Operations Bridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="title">⚡ CTF BRIDGE</div>
    <div id="status-indicator" class="status disconnected">DISCONNECTED</div>
  </div>

  <div class="card">
    <div class="row">
      <span class="label">Bridge Port:</span>
      <span class="value" id="port-display">18888</span>
    </div>
    <div class="row">
      <span class="label">Requests Forwarded:</span>
      <span class="value" id="req-count">0</span>
    </div>
  </div>

  <div class="form-group">
    <label for="token-input">Bridge Token (Optional):</label>
    <input type="password" id="token-input" placeholder="Auto-detect from ~/.config" />
  </div>

  <div class="actions">
    <button id="btn-save" class="btn primary">Lưu & Kết nối lại</button>
    <button id="btn-refresh" class="btn secondary">Làm mới</button>
  </div>

  <div class="footer">
    <span>UCS_ExOdia CTF Framework</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
